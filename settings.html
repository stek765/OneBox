<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg: #fff; --text: #1d1f2b; --line: rgba(60, 70, 120, .16); --soft: rgba(60, 70, 120, .1); --accent: #4f7cff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f2233; --text: #e8ebf7; --line: rgba(160, 175, 235, .18); --soft: rgba(160, 175, 235, .14); } }
  body { font: 13px -apple-system, sans-serif; margin: 0; padding: 18px 28px 0; overflow-y: auto; height: 100vh; box-sizing: border-box; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  header img { width: 46px; height: 46px; }
  header .name { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  header small { display: block; opacity: .6; margin-top: 1px; }
  header .quit { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  header .quit:hover { color: #ff6369; border-color: #ff6369; }
  h3 { margin: 28px 0 6px; padding: 8px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border-left: 3px solid #ff9a52; border-radius: 0 7px 7px 0; background: rgba(255, 154, 82, .14); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .opts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  button { font: inherit; color: inherit; border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: var(--soft); }
  button.on { background: var(--accent); border-color: transparent; color: #fff; }
  .sw { width: 38px; height: 22px; border-radius: 11px; padding: 0; position: relative; background: var(--soft); border: 0; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .12s; }
  .sw.on { background: #30a46c; } .sw.on::after { left: 18px; }
  .ico { width: 40px; height: 32px; padding: 0; display: grid; place-items: center; }
  .ico img { width: 18px; height: 18px; }
  @media (prefers-color-scheme: dark) { .ico img { filter: invert(1); } }
  .ico.on img { filter: invert(1); }
  input[type=time] { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px; }
  small { opacity: .6; display: block; margin-top: 2px; }
  /* full width, flush with the bottom: the dusk colours of the README screenshots, a bit lighter */
  footer { margin: 32px -28px 0; padding: 22px 28px; text-align: center; font-weight: 600; color: #fff; background: linear-gradient(135deg, #2f3350 0%, #6b4a5a 50%, #e39a6a 100%); }
</style>
<div id="app"></div>
<script>
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const ZOOMS = [[1, '100%'], [0.9, '90%'], [0.8, '80%'], [0.7, '70%'], [0.6, '60%']];
  const LANGS = [['en', 'English'], ['it', 'Italiano']];
  let S, SV, ICONS, VERSION, LATEST, UPD, CAN, t;
  const apply = (p) => ({ settings: S, services: SV, icons: ICONS, version: VERSION, latest: LATEST, upd: UPD, canInstall: CAN, t } = p);

  const set = async (patch) => { apply(await settings.set(patch)); render(); };
  const opts = (list, cur, key) => { const d = el('div', 'opts'); for (const [v, label] of list) { const b = el('button', v === cur ? 'on' : '', label); b.onclick = () => set({ [key]: v }); d.append(b); } return d; };
  const sw = (on, fn) => { const b = el('button', `sw${on ? ' on' : ''}`); b.onclick = fn; return b; };
  const row = (label, ctrl, hint) => { const r = el('div', 'row'); const l = el('div'); l.append(el('span', '', label)); if (hint) l.append(el('small', '', hint)); r.append(l, ctrl); return r; };

  const toggle = (caption, on, fn) => { const w = el('label'); w.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;opacity:.9'; w.append(sw(on, fn), el('span', '', caption)); return w; };
  const serviceCtl = (s) => {
    const hidden = S.hidden.includes(s.id), muted = S.muted.includes(s.id);
    const d = el('div', 'opts'); d.style.gap = '16px';
    d.append(
      toggle(t.visible, !hidden, () => set({ hidden: hidden ? S.hidden.filter((x) => x !== s.id) : [...S.hidden, s.id] })),
      toggle(t.notifications, !muted, () => set({ muted: muted ? S.muted.filter((x) => x !== s.id) : [...S.muted, s.id] })),
    );
    return d;
  };

  const updateBtn = () => {
    const f = (k) => t[k].replace('{0}', LATEST);
    if (!CAN) { const b = el('button', 'on', f('updateOpen')); b.onclick = () => settings.update(); return b; }
    if (UPD.state === 'downloading') { const b = el('button', '', t.updating.replace('{0}', UPD.pct)); b.disabled = true; return b; }
    if (UPD.state === 'ready') { const b = el('button', 'on', f('updateReady')); b.onclick = () => settings.install(); return b; }
    const b = el('button', 'on', UPD.state === 'error' ? t.updateFailed : f('updateBtn'));
    b.onclick = () => (UPD.state === 'error' ? settings.openRelease() : settings.update());
    return b;
  };

  function header() {
    const h = el('header');
    const logo = el('img'); logo.src = 'assets/logo.png'; logo.alt = '';
    const title = el('div'); title.append(el('div', 'name', 'Onebox'), el('small', '', `${t.tagline} · v${VERSION}`));
    const q = el('button', 'quit', `⏻ ${t.quit}`); q.title = t.quitTitle; q.onclick = () => settings.quit();
    h.append(logo, title, q);
    return h;
  }

  function render() {
    const icons = el('div', 'opts');
    for (const [k, label] of ICONS) {
      const b = el('button', `ico${k === S.icon ? ' on' : ''}`); b.title = label;
      const i = el('img'); i.src = `assets/${k}Template@2x.png`; b.append(i);
      b.onclick = () => set({ icon: k });
      icons.append(b);
    }
    const time = (key) => { const i = el('input'); i.type = 'time'; i.value = S.quiet[key]; i.onchange = () => i.value && set({ quiet: { ...S.quiet, [key]: i.value } }); return i; };
    const quietCtl = el('div', 'opts'); quietCtl.style.alignItems = 'center';
    quietCtl.append(time('from'), el('span', '', '→'), time('to'), sw(S.quiet.on, () => set({ quiet: { ...S.quiet, on: !S.quiet.on } })));

    const SHORT = [['', t.none], ['Alt+Cmd+O', '⌥⌘O'], ['Ctrl+Alt+Space', t.space]];
    const WIDTHS = [[560, t.narrow], [820, t.medium], [1040, t.wide]];
    const THEMES = [['system', t.system], ['light', t.light], ['dark', t.dark]];
    document.getElementById('app').replaceChildren(
      header(),
      ...(LATEST ? [row(t.updateAvailable.replace('{0}', LATEST), updateBtn(), t.updateHint)] : []),
      el('h3', '', t.secLook),
      row(t.theme, opts(THEMES, S.theme, 'theme')),
      row(t.width, opts(WIDTHS, S.width, 'width'), t.widthHint),
      row(t.zoom, opts(ZOOMS, S.zoom, 'zoom'), t.zoomHint),
      row(t.icon, icons),
      row(t.animate, sw(S.animate, () => set({ animate: !S.animate })), t.animateHint),
      row(t.count, sw(S.showCount, () => set({ showCount: !S.showCount }))),
      row(t.updateBadge, sw(S.updateBadge, () => set({ updateBadge: !S.updateBadge })), t.updateBadgeHint),
      el('h3', '', t.secNotif),
      row(t.notif, sw(S.notifications, () => set({ notifications: !S.notifications }))),
      row(t.quiet, quietCtl, t.quietHint),
      el('h3', '', t.secServices),
      el('small', '', t.servicesHint),
      ...SV.map((s) => row(s.name, serviceCtl(s))),
      el('h3', '', t.secGeneral),
      row(t.language, opts(LANGS, S.lang, 'lang')),
      row(t.login, sw(S.launchAtLogin, () => set({ launchAtLogin: !S.launchAtLogin }))),
      row(t.clearCache, sw(S.clearCacheOnQuit, () => set({ clearCacheOnQuit: !S.clearCacheOnQuit })), t.clearCacheHint),
      row(t.blur, sw(S.closeOnBlur, () => set({ closeOnBlur: !S.closeOnBlur }))),
      row(t.shortcut, opts(SHORT, S.shortcut, 'shortcut'), t.shortcutHint),
      el('footer', '', `Onebox v${VERSION} · open source`),
    );
  }

  async function load() { apply(await settings.get()); render(); }
  settings.onOpen(load);
  settings.onUpdate(load);
  load();
</script>
